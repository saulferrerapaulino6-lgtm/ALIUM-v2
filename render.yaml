services:
  - type: web
    name: alium-pc-builder
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: EBAY_ENV
        value: production
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_US
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
